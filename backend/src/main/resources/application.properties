spring.application.name=idms-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/idms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=health